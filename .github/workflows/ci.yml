name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: check + assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # CR-13: install the SDK components this build actually uses instead of relying on AGP's
      # auto-install (which depends on runner licences and auto-download being allowed).
      # compileSdk 36 (docs/02 §14) + the build-tools AGP 8.11.1 defaults to.
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      # gradle.properties pins org.gradle.java.home to the macOS JBR; override it on Linux CI.
      # `check` is the local definition of green (CodeReview CR-13): it runs the unit tests, lint,
      # `verifyPureKotlin` (docs/02 §3.2 rule 1) and `verifyModuleDependencies` (rules 2–5, CR-01).
      # The shell `grep` guard that used to live here is gone: it only covered rule 1, only matched
      # `import` lines (BUG-005), and duplicated the Gradle task now running in `check`.
      - name: check + lint
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" check lint

      - name: assembleDebug
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug

      # CR-13: the release artifact is part of the P0 exit condition, so CI must build it. CR-07
      # makes an unsigned release build fail, so the signing credentials have to come from Secrets.
      - name: assembleRelease
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleRelease

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: ignore
