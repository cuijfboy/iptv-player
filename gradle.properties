# --- JDK: this machine has no system Java (/usr/bin/java is a stub). Point Gradle at
# Android Studio's bundled JetBrains Runtime (JBR). See docs/05-过程记录/05-P0构建验证.md. ---
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Left OFF until the first online build is green; flip to true once verified
# (AGP 8.11 + KSP + Hilt support it, but it is not worth an opaque first-build failure).
org.gradle.configuration-cache=false

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
